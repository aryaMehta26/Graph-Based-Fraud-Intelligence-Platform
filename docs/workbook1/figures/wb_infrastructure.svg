<svg xmlns="http://www.w3.org/2000/svg" width="470pt" height="276pt" viewBox="0 0 470 276" role="img" aria-label="Three-tier infrastructure: presentation tier with React, Streamlit and Neo4j Browser; application tier with the read-only graph API, detection service, offline LLM investigator on Colab and Airflow; data tier with the Neo4j knowledge graph, parquet lake, artifact store, Google Drive and QA graph.">
  <style>
    text { font-family: "Times New Roman", Times, serif; fill: #000; }
    .t { font-size: 8.5px; font-weight: bold; }
    .s { font-size: 7.5px; }
    .gt { font-size: 8.5px; font-weight: bold; font-style: italic; }
    .el { font-size: 7.5px; font-style: italic; }
    .box { fill: #fff; stroke: #000; stroke-width: 0.8; }
    .shade { fill: #e3e3e3; }
    .band { fill: #f4f4f4; stroke: #000; stroke-width: 0.5; }
    .ar { fill: none; stroke: #000; stroke-width: 0.8; marker-end: url(#ah); }
    .dash { stroke-dasharray: 2.5 2; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  </defs>
  <rect width="470" height="276" fill="#fff"/>

  <!-- Tiers -->
  <rect class="band" x="8" y="8" width="454" height="78"/>
  <text class="gt" x="454" y="20" text-anchor="end">Presentation tier</text>
  <rect class="band" x="8" y="100" width="454" height="76"/>
  <text class="gt" x="454" y="112" text-anchor="end">Application and AI tier</text>
  <rect class="band" x="8" y="190" width="454" height="80"/>
  <text class="gt" x="16" y="202">Data tier</text>

  <!-- Presentation -->
  <rect class="box" x="18" y="28" width="144" height="48"/>
  <text class="t" x="90" y="42" text-anchor="middle">Analyst dashboard</text>
  <text class="s" x="90" y="53" text-anchor="middle">React, Vite, TypeScript</text>
  <text class="s" x="90" y="63" text-anchor="middle">six analyst pages</text>
  <rect class="box" x="172" y="28" width="144" height="48"/>
  <text class="t" x="244" y="42" text-anchor="middle">Pipeline dashboard</text>
  <text class="s" x="244" y="53" text-anchor="middle">Streamlit</text>
  <text class="s" x="244" y="63" text-anchor="middle">eight operational views</text>
  <rect class="box" x="326" y="28" width="128" height="48"/>
  <text class="t" x="390" y="42" text-anchor="middle">Graph console</text>
  <text class="s" x="390" y="53" text-anchor="middle">Neo4j Browser</text>
  <text class="s" x="390" y="63" text-anchor="middle">Cypher exploration</text>

  <!-- Application -->
  <rect class="box" x="18" y="120" width="102" height="48"/>
  <text class="t" x="69" y="134" text-anchor="middle">Graph API</text>
  <text class="s" x="69" y="145" text-anchor="middle">Python HTTP server</text>
  <text class="s" x="69" y="155" text-anchor="middle">read-only queries</text>
  <rect class="box shade" x="130" y="120" width="96" height="48"/>
  <text class="t" x="178" y="134" text-anchor="middle">Detection service</text>
  <text class="s" x="178" y="145" text-anchor="middle">XGBoost scoring</text>
  <text class="s" x="178" y="155" text-anchor="middle">SHAP explanations</text>
  <rect class="box shade" x="236" y="120" width="108" height="48"/>
  <text class="t" x="290" y="134" text-anchor="middle">LLM investigator</text>
  <text class="s" x="290" y="145" text-anchor="middle">fine-tuned, Colab GPU</text>
  <text class="s" x="290" y="155" text-anchor="middle">batch (offline)</text>
  <rect class="box" x="354" y="120" width="100" height="48"/>
  <text class="t" x="404" y="134" text-anchor="middle">Orchestration</text>
  <text class="s" x="404" y="145" text-anchor="middle">Airflow 3.2 DAGs</text>
  <text class="s" x="404" y="155" text-anchor="middle">scheduled QA sync</text>

  <!-- Data -->
  <path class="box" d="M18 216 V256 A45 5 0 0 0 108 256 V216"/>
  <ellipse class="box" cx="63" cy="216" rx="45" ry="5"/>
  <text class="t" x="63" y="236" text-anchor="middle">Knowledge graph</text>
  <text class="s" x="63" y="247" text-anchor="middle">Neo4j 5.26</text>
  <rect class="box" x="118" y="210" width="82" height="52"/>
  <text class="t" x="159" y="226" text-anchor="middle">Data lake</text>
  <text class="s" x="159" y="237" text-anchor="middle">Parquet splits,</text>
  <text class="s" x="159" y="247" text-anchor="middle">feature store</text>
  <rect class="box" x="210" y="210" width="72" height="52"/>
  <text class="t" x="246" y="226" text-anchor="middle">Artifact store</text>
  <text class="s" x="246" y="237" text-anchor="middle">models, metrics,</text>
  <text class="s" x="246" y="247" text-anchor="middle">report JSON</text>
  <rect class="box" x="292" y="210" width="80" height="52"/>
  <text class="t" x="332" y="226" text-anchor="middle">Google Drive</text>
  <text class="s" x="332" y="237" text-anchor="middle">adapters, cases,</text>
  <text class="s" x="332" y="247" text-anchor="middle">traces</text>
  <path class="box" d="M382 216 V256 A36 5 0 0 0 454 256 V216"/>
  <ellipse class="box" cx="418" cy="216" rx="36" ry="5"/>
  <text class="t" x="418" y="236" text-anchor="middle">QA graph</text>
  <text class="s" x="418" y="247" text-anchor="middle">Neo4j (sample)</text>

  <!-- Flows -->
  <line class="ar" x1="63" y1="76" x2="63" y2="119"/>
  <text class="el" x="67" y="96">HTTP / JSON</text>
  <line class="ar" x1="190" y1="76" x2="190" y2="119"/>
  <text class="el" x="194" y="96">scores</text>
  <line class="ar" x1="63" y1="168" x2="63" y2="210"/>
  <text class="el" x="67" y="186">Bolt, read-only</text>
  <line class="ar" x1="165" y1="168" x2="165" y2="209"/>
  <text class="el" x="161" y="186" text-anchor="end">features</text>
  <line class="ar" x1="218" y1="168" x2="218" y2="209"/>
  <text class="el" x="222" y="186">metrics</text>
  <line class="ar" x1="318" y1="168" x2="318" y2="209"/>
  <text class="el" x="322" y="186">traces</text>
  <line class="ar" x1="418" y1="168" x2="418" y2="210"/>
  <text class="el" x="422" y="186">reset, load</text>
  <line class="ar dash" x1="292" y1="236" x2="283" y2="236"/>
</svg>
